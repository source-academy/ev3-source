name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "sling-*"
      - "dev-*"
      - "release-*"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: satackey/action-docker-layer-caching@v0.0.8
      - name: install brickstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libguestfs-tools qemu-user-static binfmt-support
          # brickstrap.sh itself is vendored at the repo root (not curl-fetched from upstream
          # ev3dev/brickstrap here) so the ext4-feature fix below (see the file's own comment,
          # source-academy/ev3-source#21) always applies regardless of what upstream does next -
          # a plain re-fetch would silently drop it.
          chmod 755 ./brickstrap.sh
      - name: build sling and sinter
        run: ./build_sling.sh
      - name: build qrcode generator
        run: ./build_qrcode.sh
      - name: build control panel
        run: ./build_control_panel.sh
      - name: build uuidtob62
        run: ./build_uuidtob62.sh
      - name: build pynter
        run: ./build_pynter.sh
      - name: check the outputs
        run: |
          file build-ev3/sling \
               build-ev3/sinter_host \
               build-ev3/executables/show_qrcode \
               build-ev3/executables/service_control \
               build-ev3/executables/uuidtob62 \
               pynter/devices/ev3/build-ev3/pynter-ev3
      - name: make vmlinuz readable
        run: sudo chmod 755 /boot/vmlinuz*
      - name: build image
        run: ./build_image.sh
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: image
          path: ev3-source.img.zip
          if-no-files-found: error
      - id: create_release
        uses: actions/create-release@v1
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: ""
          draft: true
      - id: tag_name
        if: ${{ github.event_name == 'push' }}
        run: echo ::set-output name=TAG_NAME::${GITHUB_REF#refs/tags/}
      - uses: actions/upload-release-asset@v1
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ev3-source.img.zip
          asset_name: ev3-source-${{ steps.tag_name.outputs.TAG_NAME }}.img.zip
          asset_content_type: application/zip
